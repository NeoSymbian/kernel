# variant.conf -- Google Pixel 3a XL (bonito, Qualcomm SDM670), booted by its bootloader (ABL) at EL1 with
# `fastboot boot boot.img`. See tools/paths.sh.
ASSP=sdm670
KERNEL_BASE=0x80080000				# where ABL loads the kernel
ROM_LIN=0x80200000				# the load window owns 0x80000000-0x801FFFFF
BOARD_SRC=specific/pixel_bonito.cpp		# the board.h interface: GIC, timer, framebuffer console, I/O map
# the MMU-off boot stub's constants: RAM below hyp-mem@85700000 (shortcut until the M4.3 RAM map adds the rest);
# ABL's splash framebuffer, 1080 x 2160 x 32 bpp, for progress bands and the load-address check
BOOT_DEFS="-DA64_BOOT_RAM_END=0x85700000 -DA64_BOOT_FB=0x9c000000 -DA64_BOOT_FB_W=1080 -DA64_BOOT_FB_BYTES=0x8e6200"
FONT=1						# the framebuffer console's font (tools/mkfont.py -> font.h)
NKSA_FAST_CPU=1					# 2 GHz cores: nkernsa's statistical checks run scaled
BOOTIMG=fastboot				# ABL rejects an image without the phone's DTB appended
DTB=${DTB:-${BONITO_DTB:-}}			# the phone's own DTB (never committed)
variant_drivers() {
	ekc "$ASSPDIR/qcom_battery.cpp"				# read-only PM660 battery telemetry
	ekc "$ASSPDIR/qcom_tsens.cpp"				# read-only temperature telemetry
	ekc "$ASSPDIR/qcom_spmi.cpp"				# the PMIC's SPMI bus (power and volume keys)
	ekc "$VDIR/specific/a64_keys.cpp"
	ekc "$ASSPDIR/qcom_rtc.cpp"				# the PMIC clock that keeps counting while off (read only)
	ekc "$VDIR/specific/a64_reboot.cpp" ${AUTOFASTBOOT:+-DA64_AUTOFASTBOOT=$AUTOFASTBOOT}	# AUTOFASTBOOT=<s>: back to fastboot after s seconds
	ekc "$VDIR/specific/a64_touch.cpp"			# the Synaptics RMI4 touchscreen
	ekc "$ASSPDIR/qcom_dsi.cpp"				# DCS commands on DSI0 (D2 display)
	ekc "$VDIR/specific/panel_sofef00.cpp"			# the OLED panel: brightness, sleep
	ekc "$VDIR/specific/a64_audio.cpp"			# telephony C6: the call-audio amps, mic codec and mic bias
	ekc "$ASSPDIR/qcom_geni_i2c.cpp"
	ekc "$ASSPDIR/qcom_rpmh.cpp"				# RPMh bus votes (the eMMC's NoC link)
	ekc "$ASSPDIR/qcom_cpufreq.cpp"				# CPU and L3 clocks: touch boost (smooth-ui S3c)
	ekc "$ASSPDIR/qcom_sdhci.cpp" ${EMMC_C:+-DA64_EMMC_C=$EMMC_C} ${EMMC_MODE:+-DA64_EMMC_MODE=$EMMC_MODE}	# EMMC_C=1: C: on userdata; 2: writes from the monitor only; EMMC_MODE=0..2 caps the bus mode
	ekc "$ASSPDIR/qcom_dwc3.cpp"				# the USB device controller core
	ekc "$BSP/common/specific/a64_usb_acm_monitor.cpp"	# its function: the USB debug console (ACM)
	# fshell's ACM port (docs debug-access.md, roadmap T8/T10): exposed while Settings -> USB debugging is on;
	# USBDEBUG=1 turns it on at boot (test images without the UI)
	ekc "$EKA/drivers/ecomm/d_comm.cpp" -I "$EKA/include/drivers" -DInitExtension=InitExtension_ecomm \
		-DKernelModuleEntry=KernelModuleEntry_ecomm -DCreateLogicalDevice=CreateLogicalDevice_ecomm
	ekc "$BSP/common/specific/a64_ecomm.cpp"
	ekc "$BSP/common/specific/a64_usb_acm_debug.cpp" -I "$EKA/include/drivers" -DA64_USBDEBUG="${USBDEBUG:-0}"
	ekc "$ASSPDIR/qcom_usbpower.cpp"			# USB power + QUSB2 PHY on a normal boot (ABL's values)
	ekc "$ASSPDIR/qcom_scm.cpp"				# telephony C2: TrustZone calls (docs/telephony.md)
	ekc "$ASSPDIR/qcom_smem.cpp"				# telephony C2: shared memory with the modem
	ekc "$ASSPDIR/qcom_smp2p.cpp"				# telephony C2: state bits with the modem
	ekc "$ASSPDIR/qcom_qmp.cpp"				# telephony C2: messages to the always-on processor
	ekc "$ASSPDIR/qcom_fat16.cpp"				# telephony C3: the modem firmware on modem_a, read-only
	ekc "$ASSPDIR/qcom_glink.cpp"				# telephony C3: GLINK channels to the modem
	ekc "$ASSPDIR/qcom_llcc.cpp"				# telephony C4: the system cache slices (the modem's too)
	ekc "$ASSPDIR/qcom_pas.cpp"				# telephony C5b: TrustZone PAS loads (IPA firmware; the ADSP in C6)
	ekc "$ASSPDIR/qcom_adsp.cpp"				# telephony C6: the ADSP (audio DSP) boot and its GLINK channels
	ekc "$ASSPDIR/qcom_smmu.cpp"				# telephony C5b: an identity SMMU context (IPA)
	ekc "$ASSPDIR/qcom_wcn3990.cpp"				# Wi-Fi W2: WCN3990 copy engines, HTC, WMI (polled)
	ekc "$ASSPDIR/qcom_ipa.cpp"				# telephony C5b: the IPA packet engine
	ekc "$ASSPDIR/qcom_mss.cpp"				# telephony C3: boots the modem
	ekc "$ASSPDIR/qcom_telhal.cpp"				# telephony C4: HAL functions for MODEMD.EXE
	ekc "$ASSPDIR/qcom_telmon.cpp"				# telephony: monitor commands
	ekc "$ASSPDIR/qcom_bootctrl.cpp" ${AUTOFASTBOOT:+-DA64_AUTOFASTBOOT=$AUTOFASTBOOT}	# A/B slots (FS5b); install images count tries
}
