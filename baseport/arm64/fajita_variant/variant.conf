# variant.conf -- OnePlus 6T (fajita, Qualcomm SDM845), booted by its bootloader (ABL) at EL1 with
# `fastboot boot boot.img` (RAM boots only: Ubuntu Touch stays on the phone). docs fajita.md. See tools/paths.sh.
ASSP=sdm845
KERNEL_BASE=0x80080000				# where ABL loads the kernel (as on the Pixel; OP0 checks it)
ROM_LIN=0x80200000				# the load window owns 0x80000000-0x801FFFFF
BOARD_SRC=specific/oneplus_fajita.cpp		# the board.h interface: GIC, timer, framebuffer console, I/O map
# the MMU-off boot stub's constants: RAM below hyp_region@85700000 (as on the Pixel); ABL's cont_splash framebuffer,
# 1080 x 2340 x 32 bpp, for progress bands and the load-address check
BOOT_DEFS="-DA64_BOOT_RAM_END=0x85700000 -DA64_BOOT_FB=0x9d400000 -DA64_BOOT_FB_W=1080 -DA64_BOOT_FB_BYTES=0x9a3f80"
FONT=1						# the framebuffer console's font (tools/mkfont.py -> font.h)
NKSA_FAST_CPU=1					# 2.8 GHz gold cores: nkernsa's statistical checks run scaled
BOOTIMG=fastboot				# ABL takes the kernel with the phone's DTB appended
DTB=${DTB:-${FAJITA_DTB:-}}			# the phone's own DTB (never committed)
variant_drivers() {	# the SoC drivers come stage by stage (docs fajita.md OP3-OP12)
	ekc "$ASSPDIR/qcom_tsens.cpp"				# read-only temperature telemetry
	ekc "$ASSPDIR/qcom_cpufreq.cpp"			# CPU and L3 clocks: touch boost
	ekc "$ASSPDIR/qcom_scm.cpp"				# TrustZone calls
	ekc "$ASSPDIR/qcom_dload.cpp"				# download (crash dump) mode off at boot: resets stay resets
	ekc "$ASSPDIR/qcom_spmi.cpp"				# the PMIC's SPMI bus (PM8998: the reboot reason)
	ekc "$BSP/bonito_variant/specific/a64_reboot.cpp" ${AUTOFASTBOOT:+-DA64_AUTOFASTBOOT=$AUTOFASTBOOT}	# PM8998 PON at the PM660's address; AUTOFASTBOOT=<s>: back to fastboot after s seconds
	ekc "$ASSPDIR/qcom_rpmh.cpp"				# RPMh votes (the USB PHY's rails, when USB has to be powered)
	ekc "$ASSPDIR/qcom_geni_i2c.cpp"			# GENI I2C: SE12 (touch), SE10 (fuel gauge, OP9)
	ekc "$VDIR/specific/fajita_keys.cpp"			# Power (PON), Volume Down/Up (PM8998 GPIO5/6), polled
	ekc "$VDIR/specific/fajita_touch.cpp"			# the Synaptics RMI4 touchscreen on SE12
	ekc "$ASSPDIR/qcom_smmu.cpp"				# the apps SMMU: an identity context for USB's stream 0x740
	ekc "$ASSPDIR/qcom_dwc3.cpp"				# the USB device controller core
	ekc "$BSP/common/specific/a64_usb_acm_monitor.cpp"	# its function: the USB debug console (ACM)
	# fshell's ACM port (docs debug-access.md); USBDEBUG=1 turns it on at boot (test images without the UI)
	ekc "$EKA/drivers/ecomm/d_comm.cpp" -I "$EKA/include/drivers" -DInitExtension=InitExtension_ecomm \
		-DKernelModuleEntry=KernelModuleEntry_ecomm -DCreateLogicalDevice=CreateLogicalDevice_ecomm
	ekc "$BSP/common/specific/a64_ecomm.cpp"
	ekc "$BSP/common/specific/a64_usb_acm_debug.cpp" -I "$EKA/include/drivers" -DA64_USBDEBUG="${USBDEBUG:-0}"
	ekc "$ASSPDIR/qcom_usbpower.cpp"			# USB power + QUSB2 PHY when ABL left them off (not on RAM boots)
	ekc "$ASSPDIR/qcom_ufs.cpp"				# UFS, read-only (OP6): "blk init" adopts ABL's link
}
