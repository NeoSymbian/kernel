# variant.conf -- QEMU virt (GICv3, Cortex-A55, 512 MB from 0x40000000; tools/run-qemu.sh). See tools/paths.sh.
ASSP=virt
KERNEL_BASE=0x40080000				# where QEMU loads an arm64 Image
ROM_LIN=0x80000000				# the kernel ROM's linear address
BOARD_SRC=specific/qemu_virt.cpp		# the board.h interface: GIC, timer, console, I/O map
BOOT_DEFS="-DA64_BOOT_RAM_END=0x60000000 -DA64_BOOT_PL011=0x09000000"	# the MMU-off boot stub's constants
variant_drivers() {
	ekc "$ASSPDIR/virtio_blk.cpp"
	ekc "$ASSPDIR/a64_serialkbd.cpp" -Dprivate=public -Dprotected=public	# its thread dump reads scheduler internals
}
